# This service is intentionally standalone — it has NO database of its own.
# It reaches two external dependencies configured via .env:
#   * ops-core-api (OPS_CORE_BASE_URL) — the operations data backend
#   * an OpenAI-compatible LLM (LLM_* )  — e.g. OpenAI or a local Ollama
#
# ops-core-api runs from its own repository/compose, so this file never assumes a
# shared docker network: reaching it through host.docker.internal keeps both
# compose files independent. Set OPS_CORE_BASE_URL=http://host.docker.internal:8000.
services:
  mcp-ops-agent:
    build: .
    ports:
      # Bound to loopback on purpose: the demo and every MCP client work the same,
      # but /mcp is never accidentally published on a machine with a public IP.
      # Host 8003 keeps ops-core-api's 8000 free; in the container it is still 8000.
      - "127.0.0.1:8003:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
