name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    # No services: this repo owns no database. Its upstreams are ops-core-api and
    # an LLM over HTTP, both replaced by test doubles, and the MCP self-loopback
    # test boots the app on a loopback port — so the whole suite runs offline.

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest --cov=src/app/services --cov-report=term-missing --cov-fail-under=60
