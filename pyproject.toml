[project]
name = "mcp-ops-agent"
version = "0.1.0"
description = "Real MCP (FastMCP) server over ops-core-api with a self-consuming agentic orchestrator"
readme = "README.md"
license = "MIT"
authors = [{ name = "upkero" }]
keywords = ["mcp", "model-context-protocol", "fastmcp", "ai-agent", "fastapi"]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.7.0",
    "openai>=1.60.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "mcp>=1.12.0",
    "tenacity>=9.1.4",
    "limits>=5.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
source = ["src/app/services"]
